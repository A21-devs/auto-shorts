name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clipwright .
      - name: Smoke test
        run: |
          docker run --rm clipwright --version
          docker run --rm --entrypoint ffmpeg clipwright -hide_banner -version | head -1
          docker run --rm --entrypoint python clipwright -c "import faster_whisper, yt_dlp, cv2, mcp; print('extras ok')"
