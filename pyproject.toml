[project]
name = "clipwright"
version = "0.3.0"
description = "Turn long videos into short captioned clips for Shorts, TikTok, Reels and more, on your own machine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
]

[project.optional-dependencies]
# speech-to-text for captions and smarter cut points (pulls in ctranslate2)
transcribe = ["faster-whisper>=1.1"]
# CUDA 12 libraries for GPU transcription (NVIDIA cards)
gpu = ["faster-whisper>=1.1", "nvidia-cublas-cu12>=12.4,<12.9", "nvidia-cudnn-cu12>=9,<10"]
# paste a YouTube/Twitch/... link instead of a file
link = ["yt-dlp>=2025.1"]
# face tracking for --layout speaker (OpenCV 5 no longer ships the face cascade)
speaker = ["opencv-python-headless>=4.10,<5"]
# MCP server (`clipwright mcp`) so AI agents can make clips
mcp = ["mcp>=2,<3"]

[project.scripts]
clipwright = "clipwright.cli:main"
# old name, kept so existing scripts keep working
autoshorts = "clipwright.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "opencv-python-headless>=4.10,<5",
    "mcp>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "yt_dlp.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs ffmpeg/ffprobe on PATH"]
